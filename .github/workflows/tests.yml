name: tests (Windows + macOS + Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Run tests (includes the reproducibility fingerprints)
        run: python -m pytest -q
      - name: Launcher works
        run: python run.py --help
